<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wortschatz — german learner's dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-shell">
        <header class="site-header">
            <a class="brand" href="/" aria-label="Wortschatz home">
                <span class="brand-mark" aria-hidden="true">W</span>
                <span>Wortschatz</span>
            </a>
            <p class="header-note">german learner's dictionary</p>
        </header>

        <section class="search-hero" aria-labelledby="page-title">
            <p class="eyebrow">learn german in context</p>
            <h1 id="page-title">find the right word</h1>
            <p class="hero-copy">definitions, grammar and real examples — all in one place</p>

            <form id="search-form" class="search-form" role="search">
                <label class="visually-hidden" for="search-input">Search for a German word</label>
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
                </span>
                <input
                    id="search-input"
                    type="text"
                    placeholder="Search a German word"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button type="submit">
                    <span>Search</span>
                    <span aria-hidden="true">↵</span>
                </button>
            </form>
            <p class="search-hint">Try <button class="example-query" type="button" data-word="geben">geben</button>, <button class="example-query" type="button" data-word="Freundschaft">Freundschaft</button> or <button class="example-query" type="button" data-word="lernen">lernen</button></p>
        </section>

        <div id="result" aria-live="polite">
            <div class="empty-state">
                <span class="empty-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h9a3 3 0 0 1 3 3v12h-9a3 3 0 0 0-3 3z"></path><path d="M19.5 4.5h-3a3 3 0 0 0-3 3v12h3a3 3 0 0 1 3 3z"></path></svg>
                </span>
                <p>Search for a word to start exploring.</p>
            </div>
        </div>
    </main>

    <script src="app.js"></script>

</body>
</html>
